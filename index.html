<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스택버거 - 기억력 보드게임</title>
    <style>
        /* 게임 느낌이 나는 귀여운 한글 폰트(Jua) 불러오기 */
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #fdf6e3; /* 부드러운 빵 같은 배경색 */
            font-family: 'Jua', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            background-color: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            text-align: center;
            border: 5px solid #ff9800; /* 치즈/오렌지색 테두리 */
        }

        h1 {
            color: #e65100;
            font-size: 3em;
            margin-top: 0;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        h2 {
            color: #4caf50; /* 양상추 느낌의 초록색 */
            font-size: 1.5em;
            margin-bottom: 25px;
            margin-top: 0;
        }

        .rules {
            text-align: left;
            background-color: #fff8e1;
            padding: 20px 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            line-height: 1.7;
            font-size: 1.1em;
        }

        .rules li {
            margin-bottom: 15px;
        }

        .highlight {
            color: #d84315; /* 패티/토마토 느낌의 붉은색 */
            font-weight: bold;
            background-color: #ffe0b2;
            padding: 2px 5px;
            border-radius: 5px;
        }

        .start-btn {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.6em;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Jua', sans-serif;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 5px 10px rgba(255, 152, 0, 0.3);
        }

        .start-btn:hover {
            background-color: #f57c00;
            transform: translateY(-3px); /* 마우스 올렸을 때 살짝 위로 뜨는 효과 */
        }

        .start-btn:active {
            transform: translateY(2px); /* 클릭할 때 눌리는 효과 */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍔 스택버거 🍔</h1>
    <h2>최고의 햄버거 요리사에 도전하세요!</h2>
    
    <div class="rules">
        <ol>
            <li><strong>레시피 확인:</strong> 화면 상단에 완성해야 할 햄버거 레시피가 나타납니다.</li>
            <li><strong>순서대로 찾기:</strong> 바닥에 뒤집힌 타일을 클릭해 <span class="highlight">반드시 아래에서부터 위로</span> 순서대로 재료를 찾아주세요. (예: 맨 아래 빵 ➔ 패티 ➔ 토마토)</li>
            <li><strong>기억력 발휘:</strong> 알맞은 재료를 찾으면 성공! 틀린 재료를 고르면 다시 뒷면으로 뒤집힙니다. 타일의 위치를 잘 기억하는 것이 핵심입니다.</li>
            <li><strong>최고 점수 달성:</strong> 제한 시간 안에 최대한 많은 햄버거를 완성해서 점수를 높여보세요!</li>
        </ol>
    </div>

    <button class="start-btn" onclick="location.href='game.html'">게임 시작하기!</button>
</div>

</body>
</html>
