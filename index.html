<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스택버거 - 기억력 보드게임</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #fdf6e3; 
            font-family: 'Jua', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            background-color: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            text-align: center;
            border: 5px solid #ff9800; 
        }

        h1 {
            color: #e65100;
            font-size: 3.5em; /* 아이들 눈에 확 띄게 제목을 조금 더 키웠어 */
            margin-top: 0;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        h2 {
            color: #4caf50; 
            font-size: 1.5em;
            margin-bottom: 25px;
            margin-top: 0;
        }

        .rules {
            text-align: left;
            background-color: #fff8e1;
            padding: 20px 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            line-height: 1.8;
            font-size: 1.2em; /* 글씨 크기를 키워서 읽기 편하게 했어 */
        }

        .rules li {
            margin-bottom: 18px;
        }

        .highlight {
            color: #d84315; 
            font-weight: bold;
            background-color: #ffe0b2;
            padding: 2px 5px;
            border-radius: 5px;
        }

        .start-btn {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.8em; /* 버튼 글씨도 큼직하게! */
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Jua', sans-serif;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 5px 10px rgba(255, 152, 0, 0.3);
        }

        .start-btn:hover {
            background-color: #f57c00;
            transform: translateY(-3px); 
        }

        .start-btn:active {
            transform: translateY(2px); 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍔 스택버거 🍔</h1>
    <h2>최고의 햄버거 요리사가 되어볼까요?</h2>
    
    <div class="rules">
        <ol>
            <li><strong>주문 확인하기!</strong> 화면 위에 있는 햄버거 그림을 잘 봐주세요.</li>
            <li><strong>아래부터 차곡차곡!</strong> 바닥에 있는 카드를 뒤집어서, 햄버거의 <span class="highlight">맨 아랫부분부터</span> 순서대로 똑같이 찾아봐요.</li>
            <li><strong>위치를 꼭 기억해요!</strong> 틀린 재료가 나오면 카드가 다시 뒤집혀요. 어떤 그림이 어디 있었는지 잘 기억해야 해요.</li>
            <li><strong>도전!</strong> 시간 안에 햄버거를 많이 만들어서 멋진 요리사가 되어보세요!</li>
        </ol>
    </div>

    <button class="start-btn" onclick="location.href='game.html'">출발~!</button>
</div>

</body>
</html>
