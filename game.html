<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스택버거 - 모자 10개 모으기 도전!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        body {
            margin: 0; padding: 0;
            background-color: #fdf6e3;
            font-family: 'Jua', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            color: #333; user-select: none; -webkit-user-select: none;
        }

        /* --- 상단 헤더 --- */
        .header {
            width: 100%; max-width: 900px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; box-sizing: border-box;
            background-color: white; border-bottom: 5px solid #ff9800;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .score-box { color: #e65100; font-size: 1.8em; }
        .time-box { color: #2e7d32; font-size: 1.8em; }
        #time { font-variant-numeric: tabular-nums; } 

        /* --- 메인 게임 영역 --- */
        .game-container {
            display: flex; flex-direction: row; justify-content: center; align-items: flex-start;
            width: 100%; max-width: 1000px; gap: 40px;
            padding: 0 20px; box-sizing: border-box;
        }

        /* --- 왼쪽: 주문서 --- */
        .recipe-board {
            background-color: #fff8e1; border: 5px solid #ffb74d; border-radius: 20px;
            padding: 20px; width: 280px; text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            position: sticky; top: 20px; 
            display: flex; flex-direction: column;
        }

        .burger-info {
            background-color: white; border: 3px dashed #ff9800; border-radius: 15px;
            padding: 10px; margin-bottom: 15px;
        }

        #burger-name { margin: 0 0 5px 0; color: #d84315; font-size: 1.6em; }
        #burger-difficulty { color: #ff9800; font-size: 1.4em; }

        .guide-text { margin: 0 0 15px 0; color: #4caf50; font-size: 1.2em; font-weight: bold; }

        .recipe-items {
            display: flex; flex-direction: column-reverse; 
            align-items: center; gap: 5px; 
            min-height: 280px; justify-content: flex-start;
        }

        .recipe-item-wrapper {
            position: relative;
            display: flex; justify-content: center; align-items: center;
            width: 120px;
            transition: transform 0.3s, opacity 0.3s;
        }

        .recipe-item-img {
            width: 100%; height: auto; 
            filter: drop-shadow(0 3px 2px rgba(0,0,0,0.1));
        }

        .ingredient-name {
            position: absolute;
            font-size: 1.3em;
            color: white;
            font-weight: bold;
            text-shadow: -1px -1px 0 #555, 1px -1px 0 #555, -1px 1px 0 #555, 1px 1px 0 #555, 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 5;
            pointer-events: none;
            letter-spacing: 1px;
        }

        .recipe-item-wrapper.current {
            transform: scale(1.15);
            filter: drop-shadow(0 0 10px rgba(76, 175, 80, 0.7));
            z-index: 10;
            animation: bun-bounce 0.6s infinite alternate;
        }

        @keyframes bun-bounce {
            from { transform: scale(1.15) translateY(0); }
            to { transform: scale(1.15) translateY(-5px); }
        }

        .recipe-item-wrapper.found { opacity: 0.3; transform: scale(0.9); animation: none; }

        /* --- 오른쪽: 카드 그리드 --- */
        .card-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
            width: 580px; 
        }

        .card { aspect-ratio: 1.1 / 1; perspective: 1000px; cursor: pointer; } 
        .card-inner {
            width: 100%; height: 100%; position: relative;
            transition: transform 0.5s; transform-style: preserve-3d;
        }

        .card.flipped .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            width: 100%; height: 100%; position: absolute; backface-visibility: hidden;
            border-radius: 15px; box-shadow: 0 6px 0 rgba(0,0,0,0.15);
            display: flex; justify-content: center; align-items: center; box-sizing: border-box;
        }

        .card-back {
            background-color: #ffb74d; border: 4px solid #f57c00;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 15px, rgba(255,255,255,0.15) 15px, rgba(255,255,255,0.15) 30px);
        }

        /* 🌟 바뀐 부분: 카드 앞면 정렬 방식 🌟 */
        .card-front { 
            background-color: white; border: 4px solid #e0e0e0; transform: rotateY(180deg); 
            flex-direction: column; /* 그림과 글씨를 위아래로 배치 */
            padding: 10px;
        }
        
        /* 카드 안의 그림 크기를 살짝 줄임 */
        .card-front svg { width: 85%; height: auto; max-height: 60%; }

        /* 🌟 바뀐 부분: 카드 아래 작은 이름 스타일 🌟 */
        .card-name {
            font-size: 1.2em; /* 아담하고 귀여운 크기 */
            color: #555; /* 너무 진하지 않은 부드러운 색 */
            font-weight: bold;
            margin-top: 8px; /* 그림과의 간격 */
            letter-spacing: 1px;
        }

        /* --- 게임 클리어 화면 --- */
        .game-over {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85); color: white;
            flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        .game-over h2 { font-size: 5em; margin: 0; color: #ffeb3b; text-shadow: 0 5px 0 #e65100; }
        .game-over p { font-size: 2.5em; margin: 20px 0; }
        .highlight-time { color: #ffeb3b; font-size: 1.2em; font-weight: bold; }
        .restart-btn {
            background-color: #4caf50; color: white; border: none; padding: 15px 50px;
            font-size: 1.8em; border-radius: 50px; cursor: pointer; font-family: 'Jua', sans-serif;
            box-shadow: 0 6px 0 #2e7d32; transition: all 0.1s;
        }
        .restart-btn:hover { background-color: #43a047; transform: translateY(-3px); }
        .restart-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #2e7d32; }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-box">👨‍🍳 획득한 모자: <span id="score">0</span> / 10개</div>
        <div class="time-box">⏱️ 걸린 시간: <span id="time">0</span>초</div>
    </div>

    <div class="game-container">
        <div class="recipe-board">
            <div class="burger-info">
                <h3 id="burger-name">햄버거 이름</h3>
                <div id="burger-difficulty">👨‍🍳👨‍🍳</div>
            </div>
            <p class="guide-text">👇 맨 아래부터 찾아요!</p>
            <div class="recipe-items" id="recipe-container">
            </div>
        </div>

        <div class="card-grid" id="grid-container">
        </div>
    </div>

    <div class="game-over" id="game-over-screen">
        <h2>최고의 요리사! 🎉</h2>
        <p>모자 10개를 모으는 데 <br><span class="highlight-time" id="final-time">0</span>초 걸렸어요!</p>
        <button class="restart-btn" onclick="location.reload()">다시 도전하기</button>
    </div>

    <script>
        const burgerGraphics = {
            bun: `<svg viewBox="0 0 120 50" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="5" width="100" height="40" rx="20" fill="#e29b4f" stroke="#c6843d" stroke-width="3"/><circle cx="30" cy="20" r="2" fill="#fdf6e3"/><circle cx="60" cy="15" r="2" fill="#fdf6e3"/><circle cx="90" cy="25" r="2" fill="#fdf6e3"/></svg>`,
            patty: `<svg viewBox="0 0 120 30" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="5" width="110" height="20" rx="10" fill="#795548" stroke="#5d4037" stroke-width="3"/></svg>`,
            cheese: `<svg viewBox="0 0 120 20" xmlns="http://www.w3.org/2000/svg"><path d="M5,5 L115,5 L105,25 L15,25 Z" fill="#ffeb3b" stroke="#fbc02d" stroke-width="2"/></svg>`,
            lettuce: `<svg viewBox="0 0 120 25" xmlns="http://www.w3.org/2000/svg"><path d="M5,15 Q30,0 60,15 Q90,30 115,15 Q90,5 60,20 Q30,35 5,15 Z" fill="#8bc34a" stroke="#689f38" stroke-width="2"/></svg>`,
            tomato: `<svg viewBox="0 0 120 30" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="5" width="100" height="20" rx="10" fill="#f44336" stroke="#d32f2f" stroke-width="3"/><circle cx="40" cy="15" r="3" fill="#ffcdd2"/><circle cx="80" cy="15" r="3" fill="#ffcdd2"/></svg>`,
            chicken: `<svg viewBox="0 0 120 30" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="5" width="110" height="20" rx="10" fill="#ffca28" stroke="#ff8f00" stroke-width="3" stroke-dasharray="6 4"/></svg>`
        };

        const ingredientNames = {
            bun: '햄버거빵',
            patty: '고기',
            cheese: '치즈',
            lettuce: '양상추',
            tomato: '토마토',
            chicken: '치킨'
        };

        const recipeBook = [
            { name: "미니버거", difficulty: 1, items: ['bun', 'patty', 'bun'] },
            { name: "나도햄버거", difficulty: 2, items: ['bun', 'patty', 'lettuce', 'bun'] },
            { name: "치즈버거", difficulty: 2, items: ['bun', 'patty', 'cheese', 'tomato', 'bun'] },
            { name: "참깨치즈버거", difficulty: 3, items: ['bun', 'patty', 'cheese', 'tomato', 'lettuce', 'bun'] },
            { name: "다이어트버거", difficulty: 3, items: ['lettuce', 'bun', 'chicken', 'tomato', 'cheese', 'lettuce'] },
            { name: "고칼로리버거", difficulty: 3, items: ['patty', 'lettuce', 'tomato', 'cheese', 'bun', 'patty'] }
        ];
        
        let score = 0;
        let timeElapsed = 0; 
        let currentRecipeObj = null; 
        let recipeStep = 0; 
        let isBoardLocked = false;
        let timerInterval;

        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const recipeContainer = document.getElementById('recipe-container');
        const gridContainer = document.getElementById('grid-container');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalTimeEl = document.getElementById('final-time');
        const burgerNameEl = document.getElementById('burger-name');
        const burgerDiffEl = document.getElementById('burger-difficulty');

        function startGame() {
            score = 0; 
            timeElapsed = 0;
            scoreEl.innerText = score; 
            timeEl.innerText = timeElapsed;
            clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                timeElapsed++;
                timeEl.innerText = timeElapsed;
            }, 1000);
            
            makeNewBurger(); 
        }

        function makeNewBurger() {
            recipeStep = 0;
            const randomIndex = Math.floor(Math.random() * recipeBook.length);
            currentRecipeObj = recipeBook[randomIndex];

            burgerNameEl.innerText = currentRecipeObj.name;
            burgerDiffEl.innerText = '👨‍🍳'.repeat(currentRecipeObj.difficulty);

            renderRecipe(); 
            setupBoard();   
        }

        function renderRecipe() {
            recipeContainer.innerHTML = '';
            currentRecipeObj.items.forEach((id, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'recipe-item-wrapper';
                
                const imgDiv = document.createElement('div');
                imgDiv.className = 'recipe-item-img';
                imgDiv.innerHTML = burgerGraphics[id];
                
                const nameLabel = document.createElement('div');
                nameLabel.className = 'ingredient-name';
                nameLabel.innerText = ingredientNames[id];

                wrapper.appendChild(imgDiv);
                wrapper.appendChild(nameLabel);

                if (index === 0) wrapper.classList.add('current');
                recipeContainer.appendChild(wrapper);
            });
        }

        function setupBoard() {
            gridContainer.innerHTML = '';
            isBoardLocked = false;

            let boardItems = [...currentRecipeObj.items];
            const allItemIds = Object.keys(burgerGraphics); 
            
            while(boardItems.length < 16) {
                const randomId = allItemIds[Math.floor(Math.random() * allItemIds.length)];
                boardItems.push(randomId);
            }

            boardItems.sort(() => Math.random() - 0.5);

            boardItems.forEach(itemId => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // 🌟 바뀐 부분: 뒤집은 카드 앞면에 그림자랑 작은 텍스트 추가 🌟
                card.innerHTML = `
                    <div class="card-inner" data-id="${itemId}">
                        <div class="card-back"></div>
                        <div class="card-front">
                            ${burgerGraphics[itemId]}
                            <div class="card-name">${ingredientNames[itemId]}</div>
                        </div>
                    </div>
                `;
                
                card.addEventListener('click', () => handleCardClick(card));
                gridContainer.appendChild(card);
            });
        }

        function handleCardClick(card) {
            if (isBoardLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped'); 
            const clickedId = card.querySelector('.card-inner').dataset.id;
            const targetId = currentRecipeObj.items[recipeStep]; 

            if (clickedId === targetId) {
                card.classList.add('matched'); 
                const recipeImgs = recipeContainer.children;
                recipeImgs[recipeStep].classList.remove('current');
                recipeImgs[recipeStep].classList.add('found');
                
                recipeStep++; 

                if (recipeStep === currentRecipeObj.items.length) {
                    isBoardLocked = true;
                    setTimeout(() => {
                        score += currentRecipeObj.difficulty;
                        scoreEl.innerText = score > 10 ? 10 : score; 

                        if (score >= 10) {
                            endGame();
                        } else {
                            makeNewBurger(); 
                        }
                    }, 500);
                } else {
                    recipeImgs[recipeStep].classList.add('current');
                }
            } else {
                isBoardLocked = true; 
                setTimeout(() => {
                    card.classList.remove('flipped'); 
                    isBoardLocked = false; 
                }, 900); 
            }
        }

        function endGame() {
            clearInterval(timerInterval); 
            gameOverScreen.style.display = 'flex';
            finalTimeEl.innerText = timeElapsed; 
        }

        window.onload = startGame;
    </script>
</body>
</html>
