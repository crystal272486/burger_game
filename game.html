<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스택버거 - 게임 화면 (PC용)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #fdf6e3;
            font-family: 'Jua', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
            user-select: none; 
            -webkit-user-select: none;
        }

        /* 상단 점수와 타이머 (넓게) */
        .header {
            width: 100%;
            max-width: 850px; /* 컴퓨터 화면에 맞게 넓혔어요 */
            display: flex;
            justify-content: space-between;
            padding: 20px 30px;
            box-sizing: border-box;
            font-size: 1.8em;
            background-color: white;
            border-bottom: 5px solid #ff9800;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .score-box { color: #e65100; }
        .time-box { color: #d32f2f; }

        /* 🌟 핵심 변경! 가로로 나란히 배치하는 컨테이너 🌟 */
        .game-container {
            display: flex;
            flex-direction: row; /* 가로(양옆)로 정렬 */
            justify-content: center;
            align-items: flex-start; /* 위쪽 줄 맞춤 */
            margin-top: 40px;
            width: 100%;
            max-width: 900px;
            gap: 50px; /* 주문서와 카드 사이의 넓은 간격 */
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* 왼쪽: 햄버거 주문서 (레시피) */
        .recipe-board {
            background-color: #fff8e1;
            border: 4px dashed #ffb74d;
            border-radius: 20px;
            padding: 20px;
            width: 250px; /* 너비 고정 */
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .recipe-board h3 {
            margin: 0 0 15px 0;
            color: #f57c00;
            font-size: 1.5em;
            line-height: 1.3;
        }

        .recipe-items {
            display: flex;
            flex-direction: column-reverse; /* 아래에서 위로 쌓이게 */
            align-items: center;
            gap: 8px;
        }

        .recipe-item {
            font-size: 3em; /* 이모지 크기 키움 */
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            transition: transform 0.3s, opacity 0.3s;
        }

        .recipe-item.current {
            transform: scale(1.15);
            border: 5px solid #4caf50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
            z-index: 10;
        }

        .recipe-item.found {
            opacity: 0.4;
            transform: scale(0.9);
        }

        /* 오른쪽: 카드 그리드 (바닥에 깔린 재료들) */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px; /* 카드 사이 간격 넓힘 */
            width: 500px; /* 카드 영역 너비 고정 */
        }

        .card {
            aspect-ratio: 1 / 1;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4em; /* 카드 안의 그림도 큼직하게 */
            border-radius: 15px;
            box-shadow: 0 5px 0 rgba(0,0,0,0.15);
        }

        .card-back {
            background-color: #ffb74d;
            border: 3px solid #f57c00;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 15px, rgba(255,255,255,0.2) 15px, rgba(255,255,255,0.2) 30px);
        }

        .card-front {
            background-color: white;
            border: 3px solid #e0e0e0;
            transform: rotateY(180deg);
        }

        /* 게임 오버 화면 */
        .game-over {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .game-over h2 { font-size: 5em; margin: 0; color: #ffeb3b; }
        .game-over p { font-size: 2.5em; margin: 20px 0; }
        .restart-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.8em;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Jua', sans-serif;
            transition: transform 0.2s;
        }
        .restart-btn:hover { transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-box">👨‍🍳 요리사 모자: <span id="score">0</span></div>
        <div class="time-box">⏰ 남은 시간: <span id="time">60</span>초</div>
    </div>

    <div class="game-container">
        
        <div class="recipe-board">
            <h3>👇 이번 주문!<br>(맨 아래부터 찾아요)</h3>
            <div class="recipe-items" id="recipe-container">
                </div>
        </div>

        <div class="card-grid" id="grid-container">
            </div>

    </div>

    <div class="game-over" id="game-over-screen">
        <h2>시간 종료!</h2>
        <p>내가 모은 요리사 모자: <span id="final-score">0</span>개 👨‍🍳</p>
        <button class="restart-btn" onclick="location.reload()">다시 하기</button>
    </div>

    <script>
        // 자바스크립트 로직은 이전과 완벽히 동일합니다.
        const ingredients = ['🍞', '🥩', '🧀', '🥬', '🍅', '🧅'];
        
        let score = 0;
        let timeLeft = 60;
        let currentRecipe = [];
        let recipeStep = 0; 
        let isBoardLocked = false; 
        let timerInterval;

        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const recipeContainer = document.getElementById('recipe-container');
        const gridContainer = document.getElementById('grid-container');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');

        function startGame() {
            score = 0;
            timeLeft = 60;
            scoreEl.innerText = score;
            timeEl.innerText = timeLeft;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTime, 1000);
            
            makeNewBurger();
        }

        function updateTime() {
            timeLeft--;
            timeEl.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endGame();
            }
        }

        function makeNewBurger() {
            recipeStep = 0;
            currentRecipe = [];
            
            currentRecipe.push('🍞'); 
            for(let i=0; i<3; i++) {
                const randomItem = ingredients[Math.floor(Math.random() * (ingredients.length - 1)) + 1];
                currentRecipe.push(randomItem);
            }
            currentRecipe.push('🍞'); 

            renderRecipe();
            setupBoard();
        }

        function renderRecipe() {
            recipeContainer.innerHTML = '';
            currentRecipe.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'recipe-item';
                div.innerText = item;
                if (index === 0) div.classList.add('current');
                recipeContainer.appendChild(div);
            });
        }

        function setupBoard() {
            gridContainer.innerHTML = '';
            isBoardLocked = false;

            let boardItems = [...currentRecipe];

            while(boardItems.length < 16) {
                const randomItem = ingredients[Math.floor(Math.random() * ingredients.length)];
                boardItems.push(randomItem);
            }

            boardItems.sort(() => Math.random() - 0.5);

            boardItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-back"></div>
                        <div class="card-front">${item}</div>
                    </div>
                `;
                
                card.addEventListener('click', () => handleCardClick(card, item));
                gridContainer.appendChild(card);
            });
        }

        function handleCardClick(card, item) {
            if (isBoardLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');

            if (item === currentRecipe[recipeStep]) {
                card.classList.add('matched'); 
                
                const recipeElements = recipeContainer.children;
                recipeElements[recipeStep].classList.remove('current');
                recipeElements[recipeStep].classList.add('found');
                
                recipeStep++; 

                if (recipeStep === currentRecipe.length) {
                    isBoardLocked = true;
                    setTimeout(() => {
                        score++;
                        scoreEl.innerText = score;
                        alert('🍔 햄버거 완성! 멋진데요?'); 
                        makeNewBurger(); 
                    }, 500);
                } else {
                    recipeElements[recipeStep].classList.add('current');
                }

            } else {
                isBoardLocked = true; 
                setTimeout(() => {
                    card.classList.remove('flipped'); 
                    isBoardLocked = false; 
                }, 800); 
            }
        }

        function endGame() {
            gameOverScreen.style.display = 'flex';
            finalScoreEl.innerText = score;
        }

        window.onload = startGame;
    </script>
</body>
</html>
